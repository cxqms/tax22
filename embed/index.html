<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>코인 세금 계산기 위젯 — 택스22</title>
<base target="_blank">
<style>
  :root { --bg:#f3f5f4; --surface:#fff; --ink:#14211c; --ink-soft:#4f5b56; --ink-faint:#93a09a; --line:#e2e8e5; --accent:#0bab7c; --accent-deep:#068f66; --accent-soft:#e6f7f0; --dark:#10201a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background: transparent; }
  body { font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all; padding:4px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; max-width:560px; margin:0 auto; }
  .top { background:var(--dark); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:10px; }
  .top .logo { font-size:15px; font-weight:900; letter-spacing:-0.02em; }
  .top .logo em { font-style:normal; color:#7fe0c2; }
  .top .t { font-size:14px; font-weight:700; margin-left:auto; color:#b9bbc4; }
  .body { padding:16px 18px 14px; }
  label { display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .in { position:relative; }
  .in input { width:100%; font:inherit; font-size:18px; font-weight:800; padding:11px 44px 11px 14px; border:1.5px solid var(--line); border-radius:12px; outline:none; color:var(--ink); }
  .in input:focus { border-color:var(--accent); }
  .in .unit { position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:13px; font-weight:700; color:var(--ink-faint); }
  .hint { font-size:12px; color:var(--accent-deep); font-weight:700; margin-top:5px; min-height:16px; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .quick button { font:inherit; font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:5px 11px; cursor:pointer; }
  .quick button:hover { border-color:var(--accent); color:var(--accent-deep); }
  .calc { width:100%; margin-top:12px; font:inherit; font-size:15px; font-weight:800; color:#fff; background:var(--accent); border:0; border-radius:12px; padding:12px; cursor:pointer; }
  .calc:hover { background:var(--accent-deep); }
  .res { display:none; margin-top:14px; background:var(--accent-soft); border-radius:12px; padding:14px 16px; }
  .res.on { display:block; }
  .res .big { font-size:13px; color:var(--ink-soft); font-weight:700; }
  .res .big b { display:block; font-size:26px; color:var(--accent-deep); letter-spacing:-0.02em; line-height:1.2; margin-top:2px; }
  .res .rows { margin-top:10px; border-top:1px dashed #bfe3d3; padding-top:10px; font-size:12.5px; color:var(--ink-soft); display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
  .res .rows b { color:var(--ink); }
  .foot { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); }
  .foot a { color:var(--accent-deep); font-weight:800; text-decoration:none; }
  .foot a:hover { text-decoration:underline; }
  @media (max-width:400px) { .top .t { display:none; } .res .rows { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="logo">택스<em>22</em></span>
    <span class="t">2027 코인 세금 계산기</span>
  </div>
  <div class="body">
    <label for="p">올해 코인 순수익 (수익 − 손실)</label>
    <div class="in"><input id="p" type="text" inputmode="numeric" placeholder="예: 10,000,000"><span class="unit">원</span></div>
    <div class="hint" id="h"></div>
    <div class="quick">
      <button type="button" data-v="5000000">500만</button>
      <button type="button" data-v="10000000">1,000만</button>
      <button type="button" data-v="30000000">3,000만</button>
      <button type="button" data-v="100000000">1억</button>
      <button type="button" data-v="0" data-clear="1">지우기</button>
    </div>
    <button class="calc" id="go" type="button">세금 계산하기</button>
    <div class="res" id="r">
      <div class="big">예상 세금 (지방세 포함 22%)<b id="tax">0원</b></div>
      <div class="rows">
        <span>기본공제 <b>2,500,000원</b></span>
        <span>과세표준 <b id="base">0원</b></span>
        <span>세후 실수령 <b id="net">0원</b></span>
        <span>실효세율 <b id="eff">0%</b></span>
      </div>
    </div>
  </div>
  <div class="foot">
    <span>의제취득가액·해외주식·증여세까지</span>
    <a href="https://tax22.kr/?utm_source=widget" rel="noopener">전체 계산기 열기 → tax22.kr</a>
  </div>
</div>
<script>
(function(){
  var p=document.getElementById('p'),h=document.getElementById('h'),r=document.getElementById('r');
  function num(s){return parseInt(String(s).replace(/[^0-9]/g,''),10)||0;}
  function fmt(n){return n.toLocaleString('ko-KR')+'원';}
  function kor(n){
    if(!n)return '';var u=[['억',1e8],['만',1e4]],s='',x=n;
    for(var i=0;i<u.length;i++){var q=Math.floor(x/u[i][1]);if(q){s+=q.toLocaleString('ko-KR')+u[i][0]+' ';x-=q*u[i][1];}}
    if(x)s+=x.toLocaleString('ko-KR');return s.trim()+'원';
  }
  p.addEventListener('input',function(){var n=num(p.value);p.value=n?n.toLocaleString('ko-KR'):'';h.textContent=kor(n);});
  p.addEventListener('keydown',function(e){if(e.key==='Enter')calc();});
  document.querySelectorAll('.quick button').forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.clear){p.value='';h.textContent='';r.classList.remove('on');return;}
    var n=num(b.dataset.v);p.value=n.toLocaleString('ko-KR');h.textContent=kor(n);calc();});});
  document.getElementById('go').addEventListener('click',calc);
  function calc(){
    var n=num(p.value);var base=Math.max(0,n-2500000);var tax=Math.floor(base*0.22);
    document.getElementById('base').textContent=fmt(base);
    document.getElementById('tax').textContent=fmt(tax);
    document.getElementById('net').textContent=fmt(n-tax);
    document.getElementById('eff').textContent=(n?((tax/n)*100).toFixed(1):'0')+'%';
    r.classList.add('on');
  }
})();
</script>
</body>
</html>
